<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track your income, expenses, and manage your budget</p>
    </header>

    <!-- 1. Dashboard Summary -->
    <section class="dashboard" aria-label="Dashboard Overview">
      <div class="card card-balance">
        <h3>Total Balance</h3>
        <p class="amount" id="total-balance">₹0.00</p>
      </div>
      <div class="card card-income">
        <h3>Total Income</h3>
        <p class="amount" id="total-income">₹0.00</p>
      </div>
      <div class="card card-expense">
        <h3>Total Expenses</h3>
        <p class="amount" id="total-expense">₹0.00</p>
      </div>
      <div class="card card-count">
        <h3>Total Transactions</h3>
        <p class="amount" id="transaction-count">0</p>
      </div>
    </section>

    <div class="main-layout">
      <!-- 2. Transaction Form Section -->
      <section class="form-section">
        <h2 id="form-heading">Add New Transaction</h2>
        <form id="transaction-form" novalidate>
          <!-- Hidden input to store ID when editing -->
          <input type="hidden" id="transaction-id">

          <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" placeholder="e.g. Monthly Salary, Grocery" required>
            <span class="error-msg" id="title-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount (₹) *</label>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
              <span class="error-msg" id="amount-error"></span>
            </div>

            <div class="form-group">
              <label for="type">Type *</label>
              <select id="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Category *</label>
              <select id="category" required>
                <option value="Food">Food & Dining</option>
                <option value="Salary">Salary</option>
                <option value="Rent">Rent & Housing</option>
                <option value="Utilities">Utilities & Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health & Medical</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Date *</label>
              <input type="date" id="date" required>
              <span class="error-msg" id="date-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="description">Description (Optional)</label>
            <textarea id="description" rows="2" placeholder="Add extra details..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add Transaction</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel Edit</button>
          </div>
        </form>
      </section>

      <!-- 3. Transactions List & Filter Section -->
      <section class="list-section">
        <h2>Transactions</h2>

        <!-- Filters & Search Controls -->
        <div class="controls-panel">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by title...">
          </div>

          <div class="filters-row">
            <select id="filter-type">
              <option value="all">All Types</option>
              <option value="income">Income Only</option>
              <option value="expense">Expense Only</option>
            </select>

            <select id="filter-category">
              <option value="all">All Categories</option>
              <option value="Food">Food & Dining</option>
              <option value="Salary">Salary</option>
              <option value="Rent">Rent & Housing</option>
              <option value="Utilities">Utilities & Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health & Medical</option>
              <option value="Other">Other</option>
            </select>

            <input type="date" id="filter-date">
            <button type="button" id="reset-filters-btn" class="btn btn-outline">Reset</button>
          </div>
        </div>

        <!-- Dynamic Transaction List -->
        <ul id="transaction-list" class="transaction-list">
          <!-- Dynamically injected items will appear here -->
        </ul>

        <!-- Empty State Message -->
        <div id="empty-state" class="empty-state">
          <p>No transactions found. Add a new one to get started!</p>
        </div>
      </section>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
